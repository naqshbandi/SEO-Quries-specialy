<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandUp Digital - AI Content & Analytics Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- App Container -->
    <div id="app"></div>

    <script>
        // --- Application State & LocalStorage Management ---
        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('bu_users')) || [],
            saveUsers: (users) => localStorage.setItem('bu_users', JSON.stringify(users)),
            getCurrentUser: () => JSON.parse(localStorage.getItem('bu_current_user')),
            setCurrentUser: (user) => localStorage.setItem('bu_current_user', JSON.stringify(user)),
            getWallet: () => JSON.parse(localStorage.getItem('bu_wallet')) || { balance: 0, transactions: [] },
            saveWallet: (wallet) => localStorage.setItem('bu_wallet', JSON.stringify(wallet)),
        };

        // Initialize Default Admin if not exists
        function initDB() {
            let users = DB.getUsers();
            if (!users.some(u => u.email === 'admin@brandup.com')) {
                users.push({
                    name: 'System Admin',
                    email: 'admin@brandup.com',
                    password: 'adminpassword',
                    role: 'admin',
                    status: 'approved',
                    package: 'Enterprise'
                });
                DB.saveUsers(users);
            }
        }
        initDB();

        // --- Main Router ---
        function renderApp() {
            const currentUser = DB.getCurrentUser();
            const appDiv = document.getElementById('app');

            if (!currentUser) {
                renderAuthPage();
                return;
            }

            // Check if user is Admin
            if (currentUser.role === 'admin') {
                renderAdminDashboard();
                return;
            }

            // Check if user package is pending approval
            if (currentUser.status === 'pending') {
                renderPendingApprovalPage();
                return;
            }

            // Check if user needs to select a package
            if (currentUser.status === 'select_package' || !currentUser.packageStatus || currentUser.packageStatus === 'pending') {
                if (currentUser.packageStatus === 'pending') {
                    renderPendingApprovalPage();
                } else {
                    renderPackageSelectionPage();
                }
                return;
            }

            // Main Dashboard
            renderMainDashboard();
        }

        // --- 1. Authentication Pages (Sign Up & Sign In) ---
        let isSignUpMode = true;

        function renderAuthPage() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-gray-900 py-12 px-4 sm:px-6 lg:px-8">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6">
                        <div class="text-center">
                            <h2 class="text-3xl font-extrabold text-indigo-600">BrandUp Digital</h2>
                            <p class="mt-2 text-sm text-gray-600">${isSignUpMode ? 'Create your professional account' : 'Sign in to access your dashboard'}</p>
                        </div>

                        <div class="flex rounded-lg bg-gray-100 p-1">
                            <button onclick="switchAuthMode(true)" class="flex-1 py-2 text-sm font-medium rounded-md transition ${isSignUpMode ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}">Sign Up</button>
                            <button onclick="switchAuthMode(false)" class="flex-1 py-2 text-sm font-medium rounded-md transition ${!isSignUpMode ? 'bg-white text-indigo-600 shadow' : 'text-gray-500'}">Sign In</button>
                        </div>

                        <form class="space-y-4" onsubmit="handleAuthSubmit(event)">
                            ${isSignUpMode ? `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                                    <input type="text" id="authName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                                <input type="email" id="authEmail" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Password</label>
                                <div class="relative mt-1">
                                    <input type="password" id="authPass" required class="block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 pr-10">
                                    <span onclick="togglePassword('authPass', 'eyePass')" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-indigo-600">
                                        <i id="eyePass" class="fa-solid fa-eye"></i>
                                    </span>
                                </div>
                            </div>
                            ${isSignUpMode ? `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                                    <div class="relative mt-1">
                                        <input type="password" id="authConfirmPass" required class="block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 pr-10">
                                        <span onclick="togglePassword('authConfirmPass', 'eyeConfirmPass')" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-indigo-600">
                                            <i id="eyeConfirmPass" class="fa-solid fa-eye"></i>
                                        </span>
                                    </div>
                                </div>
                            ` : ''}
                            <div id="authError" class="text-red-500 text-sm hidden"></div>
                            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-lg shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 font-medium transition">
                                ${isSignUpMode ? 'Sign Up & Continue' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchAuthMode(signup) {
            isSignUpMode = signup;
            renderAuthPage();
        }

        function togglePassword(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value;
            const errDiv = document.getElementById('authError');
            let users = DB.getUsers();

            if (isSignUpMode) {
                const name = document.getElementById('authName').value.trim();
                const confirmPass = document.getElementById('authConfirmPass').value;

                if (pass !== confirmPass) {
                    errDiv.innerText = "Passwords do not match!";
                    errDiv.classList.remove('hidden');
                    return;
                }
                if (users.some(u => u.email === email)) {
                    errDiv.innerText = "Email already registered. Please sign in.";
                    errDiv.classList.remove('hidden');
                    return;
                }

                const newUser = {
                    name,
                    email,
                    password: pass,
                    role: 'user',
                    status: 'select_package',
                    package: null,
                    packageStatus: 'none'
                };
                users.push(newUser);
                DB.saveUsers(users);
                DB.setCurrentUser(newUser);
                renderApp();
            } else {
                const user = users.find(u => u.email === email && u.password === pass);
                if (!user) {
                    errDiv.innerText = "Invalid email or password, or account does not exist.";
                    errDiv.classList.remove('hidden');
                    return;
                }
                DB.setCurrentUser(user);
                renderApp();
            }
        }

        // --- 2. Package Plans Page ---
        function renderPackageSelectionPage() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="min-h-screen bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
                    <div class="max-w-4xl mx-auto text-center">
                        <h2 class="text-3xl font-extrabold text-indigo-600">Select Your Package Plan</h2>
                        <p class="mt-2 text-gray-600">Choose a plan to unlock the BrandUp Digital AI Search Dashboard</p>
                        
                        <div class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- Monthly Plan -->
                            <div class="bg-white rounded-2xl shadow-xl p-8 border-2 border-indigo-100 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">Monthly Plan</h3>
                                    <p class="mt-4 text-gray-500">Full access billed monthly</p>
                                    <div class="mt-6 text-4xl font-extrabold text-indigo-600">$200<span class="text-base font-medium text-gray-500">/month</span></div>
                                </div>
                                <button onclick="selectPackage('Monthly', 200)" class="mt-8 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">Choose Monthly</button>
                            </div>

                            <!-- Annual Plan -->
                            <div class="bg-white rounded-2xl shadow-xl p-8 border-2 border-indigo-600 flex flex-col justify-between relative">
                                <span class="absolute top-0 right-8 transform -translate-y-1/2 bg-indigo-600 text-white text-xs font-bold uppercase py-1 px-3 rounded-full">Best Value</span>
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">Annual Plan</h3>
                                    <p class="mt-4 text-gray-500">Full access billed annually (Save $200)</p>
                                    <div class="mt-6 text-4xl font-extrabold text-indigo-600">$2200<span class="text-base font-medium text-gray-500">/year</span></div>
                                </div>
                                <button onclick="selectPackage('Annual', 2200)" class="mt-8 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">Choose Annual</button>
                            </div>
                        </div>
                        <div class="mt-8">
                            <button onclick="logout()" class="text-sm text-red-600 hover:underline">Sign Out</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPackage(packageName, amount) {
            let user = DB.getCurrentUser();
            user.package = packageName;
            user.packageStatus = 'pending';
            DB.setCurrentUser(user);

            // Update users list
            let users = DB.getUsers();
            users = users.map(u => u.email === user.email ? user : u);
            DB.saveUsers(users);

            // Add to Company Wallet (held securely)
            let wallet = DB.getWallet();
            wallet.transactions.push({
                user: user.email,
                package: packageName,
                amount: amount,
                date: new Date().toISOString(),
                status: 'Held in Wallet (Pending Admin Approval)'
            });
            DB.saveWallet(wallet);

            renderApp();
        }

        // --- 3. Pending Approval Page ---
        function renderPendingApprovalPage() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
                    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center space-y-4">
                        <div class="text-yellow-500 text-5xl"><i class="fa-solid fa-hourglass-half animate-spin"></i></div>
                        <h2 class="text-2xl font-bold text-gray-900">Waiting for Admin Approval</h2>
                        <p class="text-gray-600">You have selected your package plan. Payment is securely held in the system wallet. Once the administrator approves your transaction, your main dashboard will unlock automatically.</p>
                        <button onclick="logout()" class="mt-4 w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">Sign Out</button>
                    </div>
                </div>
            `;
        }

        // --- 4. Admin Dashboard ---
        function renderAdminDashboard() {
            let users = DB.getUsers();
            let wallet = DB.getWallet();
            let totalWalletBalance = wallet.transactions.reduce((acc, tx) => acc + tx.amount, 0);

            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="min-h-screen bg-gray-100 p-8">
                    <div class="max-w-6xl mx-auto space-y-8">
                        <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow">
                            <div>
                                <h1 class="text-2xl font-bold text-indigo-600">Admin Control Panel - BrandUp Digital</h1>
                                <p class="text-sm text-gray-500">Manage user approvals and platform wallet funds</p>
                            </div>
                            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600">Sign Out</button>
                        </div>

                        <!-- Wallet Card -->
                        <div class="bg-indigo-900 text-white p-6 rounded-xl shadow flex justify-between items-center">
                            <div>
                                <p class="text-indigo-200 text-sm">Secure System Wallet Balance</p>
                                <h3 class="text-3xl font-bold mt-1">$${totalWalletBalance}</h3>
                                <p class="text-xs text-indigo-300 mt-1">All incoming package payments are safely retained here.</p>
                            </div>
                            <button onclick="withdrawFunds()" class="bg-white text-indigo-900 px-6 py-3 rounded-lg font-bold hover:bg-indigo-50 transition shadow">Withdraw to Bank Account</button>
                        </div>

                        <!-- User Approvals Table -->
                        <div class="bg-white rounded-xl shadow overflow-hidden">
                            <div class="p-6 border-b border-gray-200">
                                <h3 class="text-lg font-bold text-gray-800">User Subscription Requests</h3>
                            </div>
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">User Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Selected Package</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    ${users.filter(u => u.role !== 'admin').map(u => `
                                        <tr>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${u.name}</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${u.email}</td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${u.package || 'None'}</td>
                                            <td class="px-6 py-4 whitespace-nowrap">
                                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${u.packageStatus === 'approved' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                                    ${u.packageStatus || 'none'}
                                                </span>
                                            </td>
                                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                                ${u.packageStatus === 'pending' ? `
                                                    <button onclick="approveUser('${u.email}')" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1 rounded font-bold">Approve</button>
                                                ` : '<span class="text-gray-400">Approved</span>'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function approveUser(email) {
            let users = DB.getUsers();
            users = users.map(u => {
                if (u.email === email) {
                    u.packageStatus = 'approved';
                    u.status = 'approved';
                }
                return u;
            });
            DB.saveUsers(users);
            renderAdminDashboard();
        }

        function withdrawFunds() {
            alert("Funds successfully withdrawn from the system wallet to the administrator's bank account!");
        }

        // --- 5. Main Dashboard (Jasper-like Search & Analytics Tool) ---
        let currentSearchQueryResults = null;
        let selectedQueryDetail = null;

        function renderMainDashboard() {
            const currentUser = DB.getCurrentUser();
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="min-h-screen bg-gray-50 flex flex-col">
                    <!-- Header -->
                    <header class="bg-white shadow-sm sticky top-0 z-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                            <div class="flex items-center space-x-4">
                                <!-- Sidebar Toggle Button -->
                                <button onclick="toggleSidebar()" class="text-gray-600 hover:text-indigo-600 focus:outline-none text-xl p-2">
                                    <i class="fa-solid fa-bars"></i>
                                </button>
                                <!-- Brand Name -->
                                <span class="text-2xl font-extrabold text-indigo-600 tracking-tight">BrandUp Digital</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-medium text-gray-700">(${currentUser.email})</span>
                            </div>
                        </div>
                        <!-- Sub-header description (H3 strictly 2 lines max) -->
                        <div class="bg-indigo-50 border-t border-indigo-100 px-4 py-2 text-center">
                            <h3 class="text-xs sm:text-sm font-semibold text-indigo-900 leading-tight">
                                Explore global keyword intelligence and deep search query history across regions and niches instantly.<br>
                                Power your digital content strategy with advanced AI-driven analytics.
                            </h3>
                        </div>
                    </header>

                    <!-- Sidebar Drawer (Hidden by default, opens only on click) -->
                    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
                    <aside id="sidebarDrawer" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between">
                        <div class="p-6 space-y-6">
                            <div class="flex justify-between items-center border-b pb-4">
                                <h2 class="text-xl font-bold text-indigo-600">Navigation Menu</h2>
                                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                            <nav class="space-y-2">
                                <a href="#" onclick="toggleSidebar(); resetView();" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-house w-5"></i><span>Home</span></a>
                                <a href="#" onclick="alert('Packages Info: Current active plan is ' + '${currentUser.package}')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-box w-5"></i><span>Packages</span></a>
                                <a href="#" onclick="alert('Your current active package plan: ' + '${currentUser.package}')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-user-check w-5"></i><span>Your Package</span></a>
                                <a href="#" onclick="alert('For support, contact admin at support@brandup.com')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium"><i class="fa-solid fa-circle-question w-5"></i><span>Help</span></a>
                            </nav>
                        </div>
                        <div class="p-6 border-t border-gray-100">
                            <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 bg-red-50 text-red-600 py-2.5 rounded-lg font-medium hover:bg-red-100 transition"><i class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span></button>
                        </div>
                    </aside>

                    <!-- Main Dashboard Content Area -->
                    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        
                        <!-- Search Filters Section (3 Dropdowns + Go Button) -->
                        <div class="bg-white rounded-2xl shadow-lg p-6 border border-gray-100">
                            <h2 class="text-lg font-bold text-gray-800 mb-4">Query Intelligence Parameters</h2>
                            <form onsubmit="handleSearchGo(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                
                                <!-- 1. Select Date -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Date</label>
                                    <input type="date" id="filterDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                </div>

                                <!-- 2. Select Region (Worldwide cities/regions) -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Region</label>
                                    <select id="filterRegion" required class="w-full px-3 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                        <option value="">Choose Region...</option>
                                        <option value="Worldwide - All Regions">Worldwide - All Regions</option>
                                        <option value="Lahore, Pakistan">Lahore, Pakistan</option>
                                        <option value="Karachi, Pakistan">Karachi, Pakistan</option>
                                        <option value="New York, USA">New York, USA</option>
                                        <option value="London, UK">London, UK</option>
                                        <option value="Dubai, UAE">Dubai, UAE</option>
                                        <option value="Toronto, Canada">Toronto, Canada</option>
                                        <option value="Sydney, Australia">Sydney, Australia</option>
                                    </select>
                                </div>

                                <!-- 3. Select Niche (Dropdown + Custom input fallback) -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Niche</label>
                                    <select id="filterNicheSelect" onchange="checkCustomNiche(this)" class="w-full px-3 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500 mb-2">
                                        <option value="">Choose Niche...</option>
                                        <option value="AI Content Writing">AI Content Writing</option>
                                        <option value="E-Commerce Apparel">E-Commerce Apparel</option>
                                        <option value="Digital Marketing">Digital Marketing</option>
                                        <option value="Crypto & Finance">Crypto & Finance</option>
                                        <option value="Custom">Other (Type Custom Niche)...</option>
                                    </select>
                                    <input type="text" id="filterNicheCustom" placeholder="Type single custom niche..." class="w-full px-3 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500 hidden">
                                </div>

                                <!-- Go Button -->
                                <div>
                                    <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 px-4 rounded-lg font-bold hover:bg-indigo-700 transition shadow">
                                        <i class="fa-solid fa-magnifying-glass mr-2"></i> Go
                                    </button>
                                </div>
                            </form>
                        </div>

                        <!-- Dynamic Results Section -->
                        <div id="resultsContainer">
                            <div class="bg-white rounded-2xl shadow-lg p-12 text-center text-gray-500">
                                <i class="fa-solid fa-chart-line text-4xl mb-3 text-indigo-300"></i>
                                <p class="text-lg">Configure your parameters above and click <strong>Go</strong> to analyze search queries.</p>
                            </div>
                        </div>

                    </main>
                </div>
            `;
        }

        // Sidebar Toggle Function
        function toggleSidebar() {
            const drawer = document.getElementById('sidebarDrawer');
            const overlay = document.getElementById('sidebarOverlay');
            if (drawer.classList.contains('-translate-x-full')) {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function resetView() {
            renderMainDashboard();
        }

        function checkCustomNiche(select) {
            const customInput = document.getElementById('filterNicheCustom');
            if (select.value === 'Custom') {
                customInput.classList.remove('hidden');
                customInput.required = true;
            } else {
                customInput.classList.add('hidden');
                customInput.required = false;
            }
        }

        // Handle Go button click
        function handleSearchGo(e) {
            e.preventDefault();
            const date = document.getElementById('filterDate').value;
            const region = document.getElementById('filterRegion').value;
            const selectNicheVal = document.getElementById('filterNicheSelect').value;
            const customNicheVal = document.getElementById('filterNicheCustom').value.trim();

            let niche = selectNicheVal === 'Custom' ? customNicheVal : selectNicheVal;

            if (!niche) {
                alert("Please select or type a single niche.");
                return;
            }

            // Generate mock queries based on niche and region for the selected date
            currentSearchQueryResults = {
                date,
                region,
                niche,
                queries: [
                    { queryText: `${niche.toLowerCase()} automation tools for scaling business`, count: 1420 },
                    { queryText: `best strategies for ${niche.toLowerCase()} in ${region}`, count: 980 },
                    { queryText: `affordable ${niche.toLowerCase()} setup guide`, count: 654 },
                    { queryText: `advanced ${niche.toLowerCase()} optimization tricks`, count: 412 }
                ]
            };

            renderSearchResultsList();
        }

        // Render search queries list for selected date, region, and niche
        function renderSearchResultsList() {
            const container = document.getElementById('resultsContainer');
            const data = currentSearchQueryResults;

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-6 space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-2">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">Search Query Analysis Results</h2>
                            <p class="text-sm text-gray-500 mt-1">
                                Date: <span class="font-semibold text-indigo-600">${data.date}</span> | 
                                Region: <span class="font-semibold text-indigo-600">${data.region}</span> | 
                                Niche: <span class="font-semibold text-indigo-600">${data.niche}</span>
                            </p>
                        </div>
                        <button onclick="resetView()" class="text-sm text-indigo-600 hover:underline font-medium"><i class="fa-solid fa-arrow-left mr-1"></i> New Search</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Search Query</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Search Count (Selected Date)</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Action</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${data.queries.map((q, idx) => `
                                    <tr class="hover:bg-indigo-50/50 cursor-pointer transition" onclick="viewQueryHistory('${idx}')">
                                        <td class="px-6 py-4 text-sm font-medium text-indigo-600 hover:underline">${q.queryText}</td>
                                        <td class="px-6 py-4 text-sm text-gray-700 font-semibold">${q.count} searches</td>
                                        <td class="px-6 py-4 text-right text-sm">
                                            <span class="text-indigo-600 font-medium">View History <i class="fa-solid fa-chevron-right ml-1 text-xs"></i></span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Render individual query history drill-down
        function viewQueryHistory(index) {
            const data = currentSearchQueryResults;
            const queryItem = data.queries[index];
            const currentUser = DB.getCurrentUser();
            const container = document.getElementById('resultsContainer');

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-6 space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div>
                            <button onclick="renderSearchResultsList()" class="text-sm text-indigo-600 hover:underline font-medium mb-2 inline-block"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Query List</button>
                            <h2 class="text-xl font-bold text-gray-800">Detailed Query History</h2>
                            <p class="text-sm text-gray-500 mt-1">Query: <span class="font-semibold text-indigo-600">"${queryItem.queryText}"</span></p>
                        </div>
                        <div class="text-right text-xs text-gray-500">
                            <p>User: <span class="font-semibold">${currentUser.email}</span></p>
                            <p>Region: ${data.region} | Niche: ${data.niche}</p>
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-2">
                        <h4 class="font-bold text-indigo-900 text-sm">User Search Journey & Context (Filtered by Date: ${data.date})</h4>
                        <p class="text-sm text-indigo-700">Below is the isolated search history showing precisely how this query was generated by this user under the selected niche and region parameters.</p>
                    </div>

                    <div class="space-y-3">
                        <div class="p-4 border rounded-xl bg-white shadow-sm flex justify-between items-center">
                            <div>
                                <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2 py-1 rounded">Timestamp: 09:15 AM</span>
                                <p class="text-sm font-medium text-gray-800 mt-2">Initial prompt refinement for ${data.niche}</p>
                                <p class="text-xs text-gray-500 mt-1">Used search string: <code>${queryItem.queryText}</code></p>
                            </div>
                            <span class="text-xs font-semibold text-green-600 bg-green-50 px-2 py-1 rounded">Successful Match</span>
                        </div>
                        <div class="p-4 border rounded-xl bg-white shadow-sm flex justify-between items-center">
                            <div>
                                <span class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2 py-1 rounded">Timestamp: 11:30 AM</span>
                                <p class="text-sm font-medium text-gray-800 mt-2">Follow-up query variant in region ${data.region}</p>
                                <p class="text-xs text-gray-500 mt-1">Used search string: <code>best practices for ${queryItem.queryText}</code></p>
                            </div>
                            <span class="text-xs font-semibold text-green-600 bg-green-50 px-2 py-1 rounded">Successful Match</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Logout function
        function logout() {
            localStorage.removeItem('bu_current_user');
            renderApp();
        }

        // Initial app load call
        renderApp();
    </script>
</body>
</html>
